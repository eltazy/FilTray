[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "filtray"
version = "0.2.0"
description = "FilTray - Cross-platform system tray app for controlling Color Filters"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "eltazy" }
]
dependencies = [
  "PySide6>=6.6.0",
]

[project.urls]
Homepage = "https://github.com/eltazy/FilTray"
Repository = "https://github.com/eltazy/FilTray.git"
Releases = "https://github.com/eltazy/FilTray/releases"

[project.optional-dependencies]
build = [
  "pyinstaller>=6.0.0",
]

[project.scripts]
filtray = "color_filter_tray.app:main"

[tool.setuptools.packages.find]
include = ["color_filter_tray*"]
