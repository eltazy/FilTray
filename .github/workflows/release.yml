name: Build and Release Executables

on:
  push:
    tags:
      - "v*.*.*" # Triggers when pushing a version tag like v0.2.0
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

permissions:
  contents: write # Required to create GitHub Releases and upload assets

env:
  APP_NAME: "FilTray"
  LINUX_BIN_NAME: "filtray"
  ENTRY_SCRIPT: "main.py"
  PYTHON_VERSION: "3.12"

jobs:
  # ---------------------------------------------------------------------------
  # 0. Run unit tests
  # ---------------------------------------------------------------------------
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run unittest suite
        run: python -m unittest discover -s tests -v

  # ---------------------------------------------------------------------------
  # 1. Build Debian (.deb) + Linux binary on Ubuntu
  # ---------------------------------------------------------------------------
  build-linux-debian:
    name: Build Linux & Debian (.deb)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build windowless Linux tray binary with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile \
            --name "${{ env.LINUX_BIN_NAME }}" \
            "${{ env.ENTRY_SCRIPT }}"

      - name: Package Linux tar.gz and Debian .deb
        run: |
          mkdir -p release-assets
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" == "${GITHUB_REF_NAME}" ]]; then
            VERSION="0.2.0"
          fi

          # 1. Create portable .tar.gz archive
          tar -czvf "release-assets/${{ env.LINUX_BIN_NAME }}-linux-x64.tar.gz" \
            -C dist "${{ env.LINUX_BIN_NAME }}"

          # 2. Build Debian (.deb) installer package (with .desktop launcher)
          chmod +x scripts/build_deb.sh
          ./scripts/build_deb.sh \
            "${{ env.LINUX_BIN_NAME }}" \
            "${VERSION}" \
            "amd64" \
            "dist/${{ env.LINUX_BIN_NAME }}" \
            "release-assets"

      - name: Upload Linux & Debian artifacts
        uses: actions/upload-artifact@v4
        with:
          name: assets-linux-debian
          path: release-assets/*

  # ---------------------------------------------------------------------------
  # 2. Build Windows (.exe & .zip) - Windowless system tray app
  # ---------------------------------------------------------------------------
  build-windows:
    name: Build Windows (.exe)
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build windowless Windows .exe with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile `
            --name "${{ env.APP_NAME }}" `
            "${{ env.ENTRY_SCRIPT }}"

      - name: Package Windows executables
        run: |
          New-Item -ItemType Directory -Force -Path release-assets
          # Standalone .exe for direct download (runs on 64-bit Intel & AMD Windows)
          Copy-Item "dist\${{ env.APP_NAME }}.exe" "release-assets\${{ env.APP_NAME }}-windows-x64.exe"
          # .zip bundle including README and LICENSE
          Compress-Archive -Path "dist\${{ env.APP_NAME }}.exe", "README.md", "LICENSE" `
            -DestinationPath "release-assets\${{ env.APP_NAME }}-windows-x64.zip"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: assets-windows
          path: release-assets/*

  # ---------------------------------------------------------------------------
  # 3. Build macOS (.app .zip & native .pkg installer)
  # ---------------------------------------------------------------------------
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    needs: test
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel # Intel macOS (runs on Intel & Apple Silicon Macs via Rosetta 2)
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build macOS .app bundle with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile \
            --name "${{ env.APP_NAME }}" \
            "${{ env.ENTRY_SCRIPT }}"

      - name: Package macOS .app zip & native .pkg installer
        run: |
          mkdir -p release-assets pkg-root/Applications
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" == "${GITHUB_REF_NAME}" ]]; then
            VERSION="0.2.0"
          fi

          # 1. Portable zipped .app bundle
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/${{ env.APP_NAME }}.app" \
            "release-assets/${{ env.APP_NAME }}-macos-${{ matrix.arch }}.zip"

          # 2. Native .pkg installer (installs FilTray.app into /Applications)
          cp -R "dist/${{ env.APP_NAME }}.app" "pkg-root/Applications/${{ env.APP_NAME }}.app"
          pkgbuild \
            --root pkg-root \
            --identifier "org.opensource.filtray" \
            --version "${VERSION}" \
            --install-location "/" \
            "release-assets/${{ env.APP_NAME }}-${VERSION}-macos-${{ matrix.arch }}.pkg"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: assets-macos-${{ matrix.arch }}
          path: release-assets/*

  # ---------------------------------------------------------------------------
  # 4. Publish GitHub Release with all assets & SHA256 checksums
  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: [build-linux-debian, build-windows, build-macos]
    if: |
      always() &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.build-linux-debian.result == 'success' &&
      needs.build-windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download all built release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release and attach binaries
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
